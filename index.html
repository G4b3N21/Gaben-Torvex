<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
   <meta name="apple-mobile-web-app-title" content="Gaben Torvex" />
  
  <!-- Saját ikon utalás az iPhone Főképernyőhöz -->
  <link rel="apple-touch-icon" href="./ikon.jpg" />
  <link rel="icon" type="image/jpeg" href="./ikon.jpg" />
  <title>Gaben Torvex</title>

  <script>
    // Protect local data from automatic deletion
    async function enablePersistentStorage() {
      if (navigator.storage && navigator.storage.persist) {
        await navigator.storage.persist();
      }
    }
    enablePersistentStorage();

    // Register Service Worker for 100% offline usage
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --bank: #10B981;
      --web: #38BDF8;
      --others: #F59E0B;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      min-height: 100vh;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px 0 80px 0; }

    /* Auth Screen */
    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      margin-top: 15vh;
      text-align: center;
    }
    .auth-box h1 { margin: 0 0 8px 0; font-size: 22px; }
    .auth-box p { color: var(--muted); font-size: 14px; margin: 0 0 20px 0; }

    /* Inputs & Buttons */
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--web); }

    button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    .btn-primary { background: #2563EB; border-color: #2563EB; color: #fff; width: 100%; padding: 13px; font-size: 16px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.4); }

    /* Header & Controls */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
    .top-bar h2 { margin: 0; font-size: 20px; }
    .neon-blue { color: #38BDF8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.55); }
    .top-actions { display: flex; gap: 6px; }

    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
    .tab { text-align: center; padding: 9px 4px; font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    .tab.active[data-cat="All"] { border-color: var(--text); background: #283548; }
    .tab.active[data-cat="Bank"] { border-color: var(--bank); color: var(--bank); }
    .tab.active[data-cat="Web"] { border-color: var(--web); color: var(--web); }
    .tab.active[data-cat="Others"] { border-color: var(--others); color: var(--others); }

    /* Cards */
    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .item-card[data-cat="Bank"] { border-left-color: var(--bank); }
    .item-card[data-cat="Web"] { border-left-color: var(--web); }
    .item-card[data-cat="Others"] { border-left-color: var(--others); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-weight: 700; font-size: 16px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; background: var(--bg); }
    .badge.Bank { color: var(--bank); }
    .badge.Web { color: var(--web); }
    .badge.Others { color: var(--others); }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .field-info { overflow: hidden; }
    .field-label { font-size: 11px; color: var(--muted); display: block; }
    .field-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; word-break: break-all; }
    .field-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .note-box { font-size: 13px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); white-space: pre-wrap; }
    .card-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    /* Floating Add Button */
    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      background: #2563EB;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      font-size: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 460px; padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin: 0 0 14px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .modal-actions button { flex: 1; }

    /* Toast */
    .toast {
      position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
      background: #10B981; color: #0F172A; font-weight: 700; padding: 8px 18px;
      border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOCK SCREEN -->
  <div id="authScreen" class="auth-box">
    <h1 id="authTitle">Unlock Vault</h1>
    <p id="authSubtitle">Enter your Master Password to decrypt your data.</p>
    <input type="password" id="masterInput" placeholder="Master Password" autocomplete="off" />
    <button class="btn-primary" id="unlockBtn">Unlock</button>
    <p id="authError" style="color: var(--danger); margin-top: 12px; margin-bottom: 0;"></p>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="hidden">
    <div class="top-bar">
      <h2><span class="neon-blue">Gaben</span> Torvex</h2>
      <div class="top-actions">
        <button class="btn-sm" onclick="exportData()">Export</button>
        <button class="btn-sm" onclick="document.getElementById('importFile').click()">Import</button>
        <button class="btn-sm btn-danger" onclick="lockVault()">Lock</button>
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)" />
      </div>
    </div>

    <input type="text" id="searchInput" placeholder="Search by name, login, or note..." oninput="renderList()" />

    <div class="tabs">
      <button class="tab active" data-cat="All" onclick="setCategory('All')">All</button>
      <button class="tab" data-cat="Bank" onclick="setCategory('Bank')">Bank</button>
      <button class="tab" data-cat="Web" onclick="setCategory('Web')">Web</button>
      <button class="tab" data-cat="Others" onclick="setCategory('Others')">Others</button>
    </div>

    <div id="itemsList"></div>
  </div>
</div>

<button id="addBtn" class="fab hidden" onclick="openModal()">+ Add</button>

<!-- ADD / EDIT MODAL -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="modalTitle">Add Entry</h3>
    <input type="hidden" id="editId" />

    <label class="field-label">Category</label>
    <select id="entryCategory" onchange="toggleFormFields()">
      <option value="Bank">Bank</option>
      <option value="Web">Web</option>
      <option value="Others">Others</option>
    </select>

    <label class="field-label">Title / Name *</label>
    <input type="text" id="entryTitle" placeholder="e.g. Debit Card / Gmail / Home Wi-Fi" />

    <!-- BANK FIELDS -->
    <div id="bankFields">
      <label class="field-label">Card Number</label>
      <input type="text" id="bankCard" placeholder="1234 5678 9012 3456" inputmode="numeric" />
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
        <div>
          <label class="field-label">Expiry (MM/YY)</label>
          <input type="text" id="bankExp" placeholder="08/28" />
        </div>
        <div>
          <label class="field-label">CVC / CVV</label>
          <input type="text" id="bankCvc" placeholder="123" inputmode="numeric" />
        </div>
        <div>
          <label class="field-label">PIN Code</label>
          <input type="text" id="bankPin" placeholder="1234" inputmode="numeric" />
        </div>
      </div>
    </div>

    <!-- WEB / OTHERS FIELDS -->
    <div id="generalFields" class="hidden">
      <label class="field-label">Username / Email / SSID</label>
      <input type="text" id="genUser" placeholder="user@example.com" autocomplete="off" />
      <label class="field-label">Password / Code</label>
      <input type="text" id="genPass" placeholder="Your password or code" autocomplete="off" />
    </div>

    <label class="field-label">Notes / Hint (Optional)</label>
    <textarea id="entryNote" rows="2" placeholder="Password hint or extra info..."></textarea>

    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">Copied to clipboard!</div>
<script>
  const STORAGE_KEY = 'encrypted_vault_data_v1';
  let masterKey = null;
  let vaultItems = [];
  let currentCategory = 'All';
  let revealedFields = new Set();

  window.addEventListener('DOMContentLoaded', () => {
    const existing = localStorage.getItem(STORAGE_KEY);
    if (!existing) {
      document.getElementById('authTitle').textContent = 'Create Master Password';
      document.getElementById('authSubtitle').textContent = 'Set a strong password. It cannot be recovered if forgotten.';
      document.getElementById('unlockBtn').textContent = 'Create & Open Vault';
    }
  });

  // Auto-lock when app goes to background
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && masterKey) lockVault();
  });

  document.getElementById('masterInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleUnlock();
  });
  document.getElementById('unlockBtn').addEventListener('click', handleUnlock);

  // Web Crypto API helpers (PBKDF2 + AES-GCM)
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function encryptVault(items, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(items)));

    return JSON.stringify({
      salt: btoa(String.fromCharCode(...salt)),
      iv: btoa(String.fromCharCode(...iv)),
      data: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
    });
  }

  async function decryptVault(encryptedJson, password) {
    const parsed = JSON.parse(encryptedJson);
    const salt = Uint8Array.from(atob(parsed.salt), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(parsed.iv), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(parsed.data), c => c.charCodeAt(0));
    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  async function handleUnlock() {
    const pwd = document.getElementById('masterInput').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';

    if (pwd.length < 4) {
      errEl.textContent = 'Please enter at least 4 characters.';
      return;
    }

    const existing = localStorage.getItem(STORAGE_KEY);
    try {
      if (!existing) {
        vaultItems = [];
        const encrypted = await encryptVault(vaultItems, pwd);
        localStorage.setItem(STORAGE_KEY, encrypted);
      } else {
        vaultItems = await decryptVault(existing, pwd);
      }
      masterKey = pwd;
      document.getElementById('masterInput').value = '';
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('addBtn').classList.remove('hidden');
      renderList();
    } catch (e) {
      errEl.textContent = 'Incorrect Master Password.';
    }
  }

  function lockVault() {
    masterKey = null;
    vaultItems = [];
    revealedFields.clear();
    document.getElementById('itemsList').innerHTML = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('addBtn').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('authTitle').textContent = 'Unlock Vault';
    document.getElementById('authSubtitle').textContent = 'Enter your Master Password to decrypt your data.';
    document.getElementById('unlockBtn').textContent = 'Unlock';
  }

  async function persistData() {
    if (!masterKey) return;
    const encrypted = await encryptVault(vaultItems, masterKey);
    localStorage.setItem(STORAGE_KEY, encrypted);
  }

  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.cat === cat);
    });
    renderList();
  }

  function toggleReveal(fieldId) {
    if (revealedFields.has(fieldId)) revealedFields.delete(fieldId);
    else revealedFields.add(fieldId);
    renderList();
  }

  function copyText(text) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }

  function createFieldRow(id, label, value, secret = false) {
    if (!value) return '';
    const isRevealed = !secret || revealedFields.has(id);
    const displayVal = isRevealed ? escapeHtml(value) : '••••••••';
    const eyeBtn = secret ? `<button class="btn-sm" onclick="toggleReveal('${id}')">${isRevealed ? 'Hide' : 'Show'}</button>` : '';
    return `
      <div class="field-row">
        <div class="field-info">
          <span class="field-label">${label}</span>
          <span class="field-val">${displayVal}</span>
        </div>
        <div class="field-actions">
          ${eyeBtn}
          <button class="btn-sm" onclick="copyText('${escapeJs(value)}')">Copy</button>
        </div>
      </div>
    `;
  }

  function renderList() {
    const listEl = document.getElementById('itemsList');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = vaultItems.filter(item => {
      const matchesCat = query ? true : (currentCategory === 'All' || item.category === currentCategory);
      const haystack = `${item.title} ${item.user || ''} ${item.note || ''} ${item.category}`.toLowerCase();
      return matchesCat && haystack.includes(query);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<p style="text-align:center; color: var(--muted); margin-top: 40px;">No entries found.</p>`;
      return;
    }

    listEl.innerHTML = filtered.map(item => {
      let fieldsHtml = '';
      if (item.category === 'Bank') {
        fieldsHtml += createFieldRow(`${item.id}_card`, 'Card Number', item.card, true);
        fieldsHtml += createFieldRow(`${item.id}_exp`, 'Expiry', item.exp, false);
        fieldsHtml += createFieldRow(`${item.id}_cvc`, 'CVC / CVV', item.cvc, true);
        fieldsHtml += createFieldRow(`${item.id}_pin`, 'PIN Code', item.pin, true);
      } else {
        fieldsHtml += createFieldRow(`${item.id}_user`, 'Login / Username', item.user, false);
        fieldsHtml += createFieldRow(`${item.id}_pass`, 'Password / Code', item.pass, true);
      }

      const noteHtml = item.note ? `<div class="note-box">${escapeHtml(item.note)}</div>` : '';

      return `
        <div class="item-card" data-cat="${item.category}">
          <div class="card-header">
            <span class="card-title">${escapeHtml(item.title)}</span>
            <span class="badge ${item.category}">${item.category}</span>
          </div>
          ${fieldsHtml}
          ${noteHtml}
          <div class="card-footer">
            <button class="btn-sm" onclick="openModal('${item.id}')">Edit</button>
            <button class="btn-sm btn-danger" onclick="deleteEntry('${item.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleFormFields() {
    const cat = document.getElementById('entryCategory').value;
    document.getElementById('bankFields').classList.toggle('hidden', cat !== 'Bank');
    document.getElementById('generalFields').classList.toggle('hidden', cat === 'Bank');
  }

  function openModal(id = null) {
    document.getElementById('editId').value = id || '';
    document.getElementById('modalTitle').textContent = id ? 'Edit Entry' : 'Add Entry';

    if (id) {
      const item = vaultItems.find(i => i.id === id);
      document.getElementById('entryCategory').value = item.category;
      document.getElementById('entryTitle').value = item.title;
      document.getElementById('bankCard').value = item.card || '';
      document.getElementById('bankExp').value = item.exp || '';
      document.getElementById('bankCvc').value = item.cvc || '';
      document.getElementById('bankPin').value = item.pin || '';
      document.getElementById('genUser').value = item.user || '';
      document.getElementById('genPass').value = item.pass || '';
      document.getElementById('entryNote').value = item.note || '';
    } else {
      document.getElementById('entryCategory').value = currentCategory !== 'All' ? currentCategory : 'Bank';
      document.getElementById('entryTitle').value = '';
      document.getElementById('bankCard').value = '';
      document.getElementById('bankExp').value = '';
      document.getElementById('bankCvc').value = '';
      document.getElementById('bankPin').value = '';
      document.getElementById('genUser').value = '';
      document.getElementById('genPass').value = '';
      document.getElementById('entryNote').value = '';
    }
    toggleFormFields();
    document.getElementById('modalBackdrop').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalBackdrop').style.display = 'none';
  }

  async function saveEntry() {
    const title = document.getElementById('entryTitle').value.trim();
    if (!title) return alert('Title is required.');

    const id = document.getElementById('editId').value || Date.now().toString();
    const category = document.getElementById('entryCategory').value;

    const entry = {
      id,
      category,
      title,
      card: document.getElementById('bankCard').value.trim(),
      exp: document.getElementById('bankExp').value.trim(),
      cvc: document.getElementById('bankCvc').value.trim(),
      pin: document.getElementById('bankPin').value.trim(),
      user: document.getElementById('genUser').value.trim(),
      pass: document.getElementById('genPass').value.trim(),
      note: document.getElementById('entryNote').value.trim()
    };

    const idx = vaultItems.findIndex(i => i.id === id);
    if (idx > -1) vaultItems[idx] = entry;
    else vaultItems.unshift(entry);

    await persistData();
    closeModal();
    renderList();
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry permanently?')) return;
    vaultItems = vaultItems.filter(i => i.id !== id);
    await persistData();
    renderList();
  }
  function exportData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const blob = new Blob([raw], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files;
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const content = e.target.result;
        const decrypted = await decryptVault(content, masterKey);
        if (Array.isArray(decrypted)) {
          vaultItems = decrypted;
          localStorage.setItem(STORAGE_KEY, content);
          renderList();
          alert('Backup imported successfully!');
        }
      } catch (err) {
        alert('Import failed: Make sure the backup file was encrypted with your current Master Password.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function escapeJs(str) {
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
</script>
</body>
</html>
